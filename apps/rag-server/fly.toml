# fly.toml — @portfolio/rag-server
#
# Deploy from the monorepo ROOT (paths below are relative to that):
#   fly deploy -c apps/rag-server/fly.toml
#
# Secrets are injected at runtime — never bake them into the image.
# Set them once with:
#   fly secrets set OPENAI_API_KEY=... ASTRA_DB_APPLICATION_TOKEN=... \
#     ASTRA_DB_API_ENDPOINT=... ASTRA_DB_KEYSPACE=default_keyspace \
#     CALENDLY_PAT=... CALENDLY_USER_URI=... CALENDLY_EVENT_TYPE_URI=... \
#     CALENDLY_SCHEDULING_URL=... CORS_ORIGIN=https://your-portfolio.com \
#     -c apps/rag-server/fly.toml

app = "portfolio-rag-server"
# Co-located with Astra DB (GCP us-east1) and OpenAI (Azure US-East).
# Server-side latency to dependencies drops from ~150ms to ~10-15ms per hop.
# internal round-trips per request — net win for time-to-first-token.
primary_region = "iad"

[build]
  # Path relative to this fly.toml's directory (apps/rag-server/).
  # The build CONTEXT is the directory `fly deploy` is invoked from — run it
  # from the monorepo root so pnpm can see pnpm-lock.yaml + pnpm-workspace.yaml.
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  # Non-sensitive tunables can live here. Sensitive ones must be secrets.

# Prometheus scrape target. Fly's Prometheus-on-Fly hits this from within
# the private network every ~15s and ships the samples to fly-metrics.net
# (available in the Grafana dropdown as the "Prometheus on Fly" data source).
# The path must match the Hono route; the port is the same one the HTTP
# service listens on — single Node process serves both /chat and /metrics.
[metrics]
  port = 3001
  path = "/metrics"

[http_service]
  internal_port = 3001
  force_https = true
  # Always-on to eliminate cold starts. Costs ~$2-4/month for a
  # shared-cpu-1x 256MB running 24/7, worth it for perceived latency.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  # Streaming from the Gateway back to the client is CPU-intensive on the
  # Node side (SSE parsing + AI SDK state machine + prom-client metrics +
  # structured logging per chunk). On shared-cpu-1x / 256MB this backpressures
  # Groq into throttling, inflating P50 to ~9s and P95 beyond 30s. shared-cpu-2x
  # doubles the vCPU share and RAM for +$2/mo and is enough for this workload.
  size = "shared-cpu-2x"
  memory = "512mb"
